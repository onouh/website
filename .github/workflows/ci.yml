name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref supersedes the previous run — save the runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Generated route types (LayoutProps, PageProps, …) only exist after
      # typegen — a fresh checkout has no .next dir to source them from.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Browsers cache across runs; the lockfile hash keys the cache to
      # @playwright/test bumps (a version change means a new browser build).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The config's webServer builds and serves the production bundle on
      # :3111 itself (reuseExistingServer is off under CI), so one command
      # runs the whole 20-test suite.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
